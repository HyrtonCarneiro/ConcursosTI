<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4364f7" />
      <stop offset="100%" stop-color="#1d2eca" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0b1747" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="14.5" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.2" />

  <!-- Shield Outline (Glassmorphism contour matching brand icon) -->
  <path d="M 32 11 
           C 41 14.5, 47.5 14, 48.5 18 
           C 49.5 32, 42.5 43.5, 32 51 
           C 21.5 43.5, 14.5 32, 15.5 18 
           C 16.5 14, 23 14.5, 32 11 Z" 
        fill="url(#shieldGrad)" 
        stroke="rgba(255, 255, 255, 0.55)" 
        stroke-width="1.6" 
        stroke-linejoin="round" />

  <!-- Graduation Cap (Crisp White with subtle depth) -->
  <g filter="url(#capShadow)">
    <!-- Top Diamond / Mortarboard -->
    <polygon points="32,22 47,28 32,34 17,28" fill="#ffffff" />
    <!-- Skullcap curve underneath -->
    <path d="M 22.5 30.5 L 22.5 35.5 C 22.5 39.5, 41.5 39.5, 41.5 35.5 L 41.5 30.5 C 38.8 32.5, 35.5 33.5, 32 33.5 C 28.5 33.5, 25.2 32.5, 22.5 30.5 Z" fill="#ffffff" />
    <!-- Tassel cord & knot -->
    <path d="M 43.5 29.5 L 46 33.5 L 46 38" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="46" cy="39" r="1.2" fill="#ffffff" />
  </g>
</svg>
